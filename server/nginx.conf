# Adna TileMap Editor — nginx site (self-hosted, HTTPS on adna.world).
#
# Bootstrap order on a fresh machine (the :443 block needs the cert to exist
# before `nginx -t` passes):
#   1. Temporarily serve only :80 (server_name + ACME challenge location).
#   2. sudo certbot certonly --webroot -w /var/www/adna \
#        -d adna.world -d www.adna.world --deploy-hook "systemctl reload nginx"
#   3. Install THIS full config and reload:
#        sudo cp server/nginx.conf /etc/nginx/sites-available/adna
#        sudo ln -sf /etc/nginx/sites-available/adna /etc/nginx/sites-enabled/adna
#        sudo rm -f /etc/nginx/sites-enabled/default
#        sudo nginx -t && sudo systemctl reload nginx
# Content is published to /var/www/adna by server/deploy.sh.
# Cloud security group must allow inbound TCP 80 AND 443.

# HTTP :80 — answer ACME renewals, redirect everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name adna.world www.adna.world;

    location ^~ /.well-known/acme-challenge/ { root /var/www/adna; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS :443 — the real site.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name adna.world www.adna.world;

    ssl_certificate     /etc/letsencrypt/live/adna.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adna.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/adna;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # JupyterLab reverse proxy — TLS terminated here, plain HTTP over loopback to
    # the local server (started with --ServerApp.base_url=/jupyter/ so its own
    # URLs match this prefix). ^~ stops the /assets regex below from matching.
    # Needs the Upgrade/Connection headers so kernel/terminal websockets work.
    location ^~ /jupyter/ {
        proxy_pass http://127.0.0.1:20712;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;   # keep long-lived websockets alive
    }

    # Tagger backend (server/tagapi.mjs via systemd adna-tagapi) — bundle list/
    # serve + draft save, so tagging can happen on a phone. Password-gated in-app.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8717;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 25m;   # tag drafts for big palette sets
    }

    # Landing page + sub-apps are plain static files (no SPA router).
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-cache the content-hashed Vite asset bundles.
    location ~* /assets/.*\.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
