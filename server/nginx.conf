# Adna TileMap Editor — nginx site (self-hosted, HTTPS on adna.world & tilemap.art).

# HTTP :80 — answer ACME renewals, redirect everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name adna.world www.adna.world tilemap.art www.tilemap.art;

    location ^~ /.well-known/acme-challenge/ { root /var/www/adna; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS :443 — adna.world
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name adna.world www.adna.world;

    ssl_certificate     /etc/letsencrypt/live/adna.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adna.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/adna;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # JupyterLab reverse proxy
    location ^~ /jupyter/ {
        proxy_pass http://127.0.0.1:20712;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Tagger backend
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8717;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    # Landing page + sub-apps are plain static files (no SPA router).
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-cache the content-hashed Vite asset bundles.
    location ~* /assets/.*\.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

