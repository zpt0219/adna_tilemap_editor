<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adna Portal</title>
  <style>
    :root {
      --bg: #14161a; --panel: #1c1f26; --panel-hi: #232733;
      --fg: #e6e8ee; --muted: #97a0b0; --line: #2c313c; --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 8vh 24px 6vh;
      position: relative;
    }
    header { text-align: center; max-width: 640px; margin-bottom: 40px; }
    h1 { font-size: 34px; margin: 0 0 10px; letter-spacing: .5px; }
    .tag { color: var(--accent); font-weight: 600; }
    .sub { color: var(--muted); margin: 0; }
    .cards {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      width: 100%;
      max-width: 640px;
    }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 24px 24px 22px; transition: .15s border-color, .15s background, .15s transform;
    }
    a.card:hover { border-color: var(--accent); background: var(--panel-hi); transform: translateY(-2px); }
    .card .ico { font-size: 28px; margin-bottom: 12px; }
    .card h2 { font-size: 19px; margin: 0 0 8px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .card .go { margin-top: 16px; color: var(--accent); font-size: 13.5px; font-weight: 600; }
    footer { margin-top: 50px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .btn {
      text-decoration: none; color: var(--fg); border: 1px solid var(--line);
      background: var(--panel); padding: 9px 16px; border-radius: 10px; font-size: 13.5px;
      display: inline-flex; align-items: center; gap: 8px; transition: .15s border-color, .15s background;
    }
    .btn:hover { border-color: var(--accent); background: var(--panel-hi); }
    .dim { color: var(--muted); font-size: 12.5px; margin-top: 26px; }
  </style>
</head>
<body>
  <!-- Language Toggle Button -->
  <button id="lang-btn" class="btn" style="position: absolute; top: 20px; right: 24px; z-index: 100; cursor: pointer; padding: 7px 12px; font-size: 13px;">
    🌐 English
  </button>

  <header>
    <h1><span class="tag">Adna</span> Portal</h1>
    <p class="sub" id="site-sub">王浩瓷砖（Wang Tiles）理论资料与程序化生成参考存档</p>
  </header>

  <main class="cards" id="cards-container">
    <a class="card" href="/wang_tiles/">
      <div class="ico">🀄</div>
      <h2>Wang Tiles Archive</h2>
      <p id="card-desc">王浩教授 Wang Tiles 理论资料存档 — 边匹配 · 角匹配 · 互动演示 · 迷宫生成。原站 cr31.co.uk 已停服。</p>
      <div class="go" id="card-go">查看存档 →</div>
    </a>
  </main>

  <footer>
    <a class="btn" href="https://github.com/zpt0219/adna_tilemap_editor" target="_blank" rel="noopener">
      <span>⌥</span> <span id="btn-github">GitHub 仓库</span>
    </a>
    <a class="btn" href="https://zpt0219.github.io/adna_tilemap_editor/" target="_blank" rel="noopener">
      <span>🌐</span> <span id="btn-pages">GitHub Pages 镜像</span>
    </a>
  </footer>

  <p class="dim" id="footer-dim">self-hosted · nginx · 东京</p>

  <script>
    const TRANSLATIONS = {
      zh: {
        sub: "王浩瓷砖（Wang Tiles）理论资料与程序化生成参考存档",
        desc: "王浩教授 Wang Tiles 理论资料存档 — 边匹配 · 角匹配 · 互动演示 · 迷宫生成。原站 cr31.co.uk 已停服。",
        go: "查看存档 →",
        btn_github: "GitHub 仓库",
        btn_pages: "GitHub Pages 镜像",
        footer_dim: "self-hosted · nginx · 东京",
        lang_btn: "🌐 English"
      },
      en: {
        sub: "Wang Tiles theory and procedural generation reference archives",
        desc: "Archive of Prof. Hao Wang's tile theory — edge matching, corner matching, interactive demos, and maze generation. Original site cr31.co.uk is offline.",
        go: "View Archive →",
        btn_github: "GitHub Repository",
        btn_pages: "GitHub Pages Mirror",
        footer_dim: "self-hosted · nginx · Tokyo",
        lang_btn: "🌐 简体中文"
      }
    };

    function updateLanguage(lang) {
      document.getElementById("site-sub").textContent = TRANSLATIONS[lang].sub;
      document.getElementById("card-desc").textContent = TRANSLATIONS[lang].desc;
      document.getElementById("card-go").textContent = TRANSLATIONS[lang].go;
      document.getElementById("btn-github").textContent = TRANSLATIONS[lang].btn_github;
      document.getElementById("btn-pages").textContent = TRANSLATIONS[lang].btn_pages;
      document.getElementById("footer-dim").textContent = TRANSLATIONS[lang].footer_dim;
      document.getElementById("lang-btn").textContent = TRANSLATIONS[lang].lang_btn;
      document.documentElement.setAttribute("lang", lang);
    }

    let currentLang = localStorage.getItem("adna_lang") || "zh";
    if (currentLang !== "zh" && currentLang !== "en") currentLang = "zh";
    updateLanguage(currentLang);

    document.getElementById("lang-btn").addEventListener("click", () => {
      currentLang = currentLang === "zh" ? "en" : "zh";
      localStorage.setItem("adna_lang", currentLang);
      updateLanguage(currentLang);
    });
  </script>
</body>
</html>
