name: Deploy reroll to GitHub Pages

# Builds the reroll app and publishes reroll/dist as the Pages site root, so it
# opens at https://<user>.github.io/adna_tilemap_editor/ .
on:
  push:
    branches: [main]
    paths:
      - "reroll/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --include=dev so @types/*, typescript and vite install even if the
      # runner has NODE_ENV=production (tsc/vite are devDependencies).
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - run: npm run build # prebuild regenerates roleColors.ts from vendor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reroll/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
