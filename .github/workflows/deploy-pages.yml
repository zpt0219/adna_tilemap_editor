name: Deploy reroll to GitHub Pages

# Builds the reroll app and publishes reroll/dist as the Pages site root, so it
# opens at https://<user>.github.io/adna_tilemap_editor/ .
on:
  push:
    branches: [main]
    paths:
      - "reroll/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The runner's default npm crashes `npm ci` with "Exit handler never
      # called!" (an npm bug) and exits 0 with an INCOMPLETE node_modules, so
      # tsc then can't find react/fflate. Pin npm to a version that installs
      # cleanly, and verify the tree afterwards so a partial install fails loudly.
      - run: npm install -g npm@10.8.2
      - run: npm ci
      - run: test -d node_modules/react && test -d node_modules/fflate
      - run: npm run build # prebuild regenerates roleColors.ts from vendor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reroll/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
